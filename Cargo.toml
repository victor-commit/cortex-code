[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/errors",
    "crates/events",
    "crates/redaction",
    "crates/settings",
    "crates/db",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
errors = { path = "crates/errors" }
events = { path = "crates/events" }
settings = { path = "crates/settings" }
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
