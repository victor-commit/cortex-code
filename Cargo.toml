[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/errors",
    "crates/events",
    "crates/redaction",
    "crates/settings",
    "crates/db",
    "crates/llm",
    "crates/providers",
    "crates/engine",
    "crates/permissions",
    "crates/policy",
    "crates/checkpoints",
    "crates/format",
    "crates/mcp",
    "crates/lsp",
    "crates/plugins",
    "crates/audit",
    "crates/skills",
    "crates/memory",
    "crates/tools",
    "crates/subagent_runner",
    "crates/tui-core",
    "crates/tui-buffer",
    "crates/tui-text",
    "crates/tui-widgets",
    "crates/tui-syntax",
    "crates/frame",
    "crates/tui-components",
    "crates/tui",
    "crates/server",
    "crates/acp",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Worker build/test infra (not product code). Full debuginfo is the dominant
# link cost and the reason the target dir ballooned. line-tables-only keeps
# panic/backtrace file:line resolution (and all test assertions) working while
# cutting the emitted DWARF; unpacked split-debuginfo keeps the debug bytes out
# of the linked binaries so relinks are far cheaper; and dropping debug for all
# dependencies (they are never stepped through here) removes the bulk of the
# 481GB target dir. Byte output of the binaries is unaffected.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[workspace.dependencies]
protocol = { path = "crates/protocol" }
errors = { path = "crates/errors" }
events = { path = "crates/events" }
redaction = { path = "crates/redaction" }
settings = { path = "crates/settings" }
db = { path = "crates/db" }
llm = { path = "crates/llm" }
providers = { path = "crates/providers" }
engine = { path = "crates/engine" }
permissions = { path = "crates/permissions" }
policy = { path = "crates/policy" }
checkpoints = { path = "crates/checkpoints" }
format = { path = "crates/format" }
mcp = { path = "crates/mcp" }
lsp = { path = "crates/lsp" }
plugins = { path = "crates/plugins" }
audit = { path = "crates/audit" }
skills = { path = "crates/skills" }
memory = { path = "crates/memory" }
tools = { path = "crates/tools" }
subagent_runner = { path = "crates/subagent_runner" }
tui-core = { path = "crates/tui-core" }
tui-buffer = { path = "crates/tui-buffer" }
tui-text = { path = "crates/tui-text" }
tui-widgets = { path = "crates/tui-widgets" }
tui-syntax = { path = "crates/tui-syntax" }
frame = { path = "crates/frame" }
tui-components = { path = "crates/tui-components" }
tui = { path = "crates/tui" }
server = { path = "crates/server" }
acp = { path = "crates/acp" }
agent-client-protocol = "=0.15.0"
rusqlite = { version = "0.32", features = ["bundled"] }
rmcp = { version = "1.7", default-features = false, features = ["client", "server", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "reqwest", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "process", "io-util", "io-std", "net"] }
tokio-test = "0.4"
eventsource-stream = "0.2"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.3"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
tree-sitter-python = "0.25.0"
streaming-iterator = "0.1"
parking_lot = "0.12"
once_cell = "1"
futures-util = "0.3"
bytes = "1"
httpdate = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
http = "1"
url = "2"
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
toml = "0.8"
regex = "1"
glob = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
smallvec = { version = "1", features = ["union", "const_generics"] }
thiserror = "2"
unicode-width = "0.2"
unicode-segmentation = "1"
pulldown-cmark = "0.13"
ahash = "0.8"
portable-pty = "0.9"
getrandom = "0.3"
