[workspace]

[package]
name = "mockup-harness-v3"
version = "0.0.0"
edition = "2021"
publish = false
description = "Isolated, deterministic Cortex Code v3 mockup harness."

[lib]
path = "src/lib.rs"

[[bin]]
name = "mockup-harness-v3"
path = "src/main.rs"

[dependencies]
ratatui = "=0.29.0"
crossterm = "=0.28.1"
image = { version = "=0.25.9", optional = true }
fontdue = { version = "=0.9.3", optional = true }

[features]
default = []
png = ["dep:image", "dep:fontdue"]
