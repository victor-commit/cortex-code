[package]
name = "tui-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false
description = "Core types and traits for Cortex TUI"

[lib]
doctest = false

[features]
# TEMP back-compat shim. DELETE in Wave 15 (T115). plan: tui-swap-fulllive
# OFF by default: keeps the foundation palette-free and ratatui-free. When on,
# republishes the 14 legacy palette consts under `style::` for the old TUI.
legacy-palette = ["dep:ratatui"]

[dependencies]
bitflags = "2"
thiserror = { workspace = true }
smallvec = { workspace = true }
# Optional, pulled in ONLY by `legacy-palette` (see src/legacy_palette.rs).
ratatui = { workspace = true, optional = true }

[lints]
workspace = true
