[package]
name = "frame"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false
description = "Markdown rendering for Cortex TUI (ported from upstream cortex-core markdown module)"

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
ratatui = { workspace = true }
pulldown-cmark = { workspace = true }
unicode-width = { workspace = true }
ahash = { workspace = true }

# Syntax highlighting seam for fenced code blocks.
tui-syntax = { workspace = true }
tui-text = { workspace = true }
once_cell = { workspace = true }
tree-sitter = { workspace = true }

# Tree-sitter grammars registered with the default highlighter.
tree-sitter-bash = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-cpp = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-java = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-json = { workspace = true }
tree-sitter-md = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-toml-ng = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-yaml = { workspace = true }
