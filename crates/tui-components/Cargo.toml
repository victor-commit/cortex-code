[package]
name = "tui-components"
description = "Reusable TUI component library for Cortex - standardized widgets, dropdowns, modals, and forms"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
# Cortex frame engine (theme, palette/style constants).
frame = { workspace = true }

# TUI framework
ratatui = { workspace = true }
crossterm = { workspace = true }

# Utilities
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }

[[example]]
name = "dump_previews"
path = "examples/dump_previews.rs"
