[package]
name = "tui-buffer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false
description = "Double-buffered terminal rendering for Cortex TUI"

[lib]
doctest = false

[dependencies]
tui-core = { path = "../tui-core" }
smallvec = { workspace = true }

# Intentionally does not use `workspace = true`: the render hot-path needs
# `get_unchecked`, but `[workspace.lints]` sets `unsafe_code = "forbid"`, which a
# crate-level `#![allow]` cannot relax. Clippy posture mirrors the workspace.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "allow"
missing_docs = "allow"

[lints.clippy]
all = "warn"
pedantic = "allow"
